name: Build Android App

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Prepare Keystore and Environment Config
        run: |
          # Restore debug keystore from base64 if not present
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          # Prepare local .env file from template if missing
          if [ ! -f .env ] && [ -f .env.example ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env
          fi

          # Prepare app/google-services.json if missing (e.g. from GitHub Secret or fallback)
          if [ ! -f app/google-services.json ]; then
            if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
              echo "Restoring google-services.json from GitHub Secrets..."
              echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
            else
              echo "Generating fallback google-services.json for CI compilation..."
              echo '{"project_info":{"project_number":"679808610868","project_id":"comicsa-479217","storage_bucket":"comicsa-479217.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:679808610868:android:44436f9366c6eaabd89061","android_client_info":{"package_name":"com.aistudio.arthastock.vyzrtp"}},"oauth_client":[{"client_id":"679808610868-tuoc5l0d2b74h639lf0m4s3ono72p206.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"AIzaSyDRtpStWlq9NbAmtKz36bVCD4qPrE01AiY"}]}],"configuration_version":"1"}' > app/google-services.json
            fi
          fi

          # Ensure gradlew has executable permissions
          chmod +x gradlew

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Android App Bundle (AAB)
        run: ./gradlew bundleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ArthaStock-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Debug AAB
        uses: actions/upload-artifact@v4
        with:
          name: ArthaStock-Debug-AAB
          path: app/build/outputs/bundle/debug/*.aab
          retention-days: 14
