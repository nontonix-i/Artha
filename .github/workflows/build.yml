name: Build Android Debug APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Prepare Debug Keystore & Config
        run: |
          mkdir -p ~/.android

          # Restore debug.keystore with multiple fallbacks
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ] && [ -s debug.keystore.base64 ]; then
              echo "Restoring debug.keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            elif [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
              echo "Restoring debug.keystore from GitHub Secret..."
              echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
            else
              echo "Restoring debug.keystore from embedded project base64..."
              echo "" | base64 -d > debug.keystore
            fi
          fi

          # Safety check: if debug.keystore is still not present, generate one via keytool
          if [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore via keytool..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Also copy to standard ~/.android/ location
          cp debug.keystore ~/.android/debug.keystore

          echo "Debug keystore ready:"
          ls -lh debug.keystore

          # Prepare local .env file from template if missing
          if [ ! -f .env ] && [ -f .env.example ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env
          fi

          # Prepare app/google-services.json if missing
          if [ ! -f app/google-services.json ]; then
            if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
              echo "Restoring google-services.json from GitHub Secrets..."
              echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
            else
              echo "Generating fallback google-services.json for CI compilation..."
              echo '{"project_info":{"project_number":"679808610868","project_id":"comicsa-479217","storage_bucket":"comicsa-479217.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:679808610868:android:44436f9366c6eaabd89061","android_client_info":{"package_name":"com.aistudio.arthastock.vyzrtp"}},"oauth_client":[{"client_id":"679808610868-tuoc5l0d2b74h639lf0m4s3ono72p206.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"AIzaSyDRtpStWlq9NbAmtKz36bVCD4qPrE01AiY"}]}],"configuration_version":"1"}' > app/google-services.json
            fi
          fi

          # Ensure gradlew has executable permissions
          chmod +x gradlew

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ArthaStock-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
